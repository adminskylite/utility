name: Secret Scan

on:
  workflow_call:
    
permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for Exposed Secrets
    runs-on: ubuntu-latest
    environment: utilCICD

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}