name: Production Health Check

on:
  workflow_call:

permissions:
  contents: read

jobs:
  health:
    name: Verify Production
    runs-on: ubuntu-latest
    environment: utilCICD

    steps:
      - name: Health Check
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            echo "Waiting for application..."

            sleep 5

            echo "Loading Node.js and PM2..."

            export PATH="/home/administrator/.nvm/versions/node/v24.14.0/bin:$PATH"

            node -v
            pm2 -v

            echo "Checking PM2..."

            pm2 describe util > /dev/null

            echo "Checking HTTP..."

            curl -f --max-time 15 http://127.0.0.1:3000 > /dev/null

            echo "Production health check PASSED."