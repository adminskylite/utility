name: Production Rollback

on:
  workflow_call:

permissions:
  contents: read

jobs:
  rollback:
    name: Restore Previous Production
    runs-on: ubuntu-latest
    environment: utilCICD

    steps:
      - name: Rollback
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            PROJECT="/home/administrator/business/utility/utility/internal"
            BACKUP="/home/administrator/deployment-backups"

            cd "$PROJECT"

            echo "Finding latest backup..."

            LATEST_BACKUP=$(find "$BACKUP" -mindepth 1 -maxdepth 1 -type d | sort | tail -1)

            if [ -z "$LATEST_BACKUP" ]; then
              echo "No backup found."
              exit 1
            fi

            PREVIOUS_COMMIT=$(cat "$LATEST_BACKUP/commit.txt")

            echo "Rolling back to:"
            echo "$PREVIOUS_COMMIT"

            git fetch origin main

            git reset --hard "$PREVIOUS_COMMIT"

            export PATH="/home/administrator/.nvm/versions/node/v24.14.0/bin:$PATH"

            npm ci

            npm run build

            pm2 restart util

            pm2 save

            sleep 5

            curl -f --max-time 15 http://127.0.0.1:3000 > /dev/null

            echo "Rollback successful."