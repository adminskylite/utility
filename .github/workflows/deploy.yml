name: Production Deployment

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: utilCICD
    
    steps:
      - name: Deploy Approved Commit
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}

          script: |
            set -e

            PROJECT="/home/administrator/business/utility/utility/internal"

            cd "$PROJECT"

            echo "Fetching latest code..."

            git fetch origin main

            echo "Deploying commit:"
            echo "$GITHUB_SHA"

            git reset --hard "$GITHUB_SHA"

            echo "Creating environment..."

            cat > .env.local << 'EOF'
            ENV_LOCAL=${{ secrets.ENV_LOCAL }}
            EOF

            export PATH="/home/administrator/.nvm/versions/node/v24.14.0/bin:$PATH"

            node -v
            npm -v

            echo "Installing dependencies..."

            npm ci

            echo "Building application..."

            npm run build

            echo "Restarting PM2..."

            if pm2 describe util > /dev/null 2>&1
            then
              pm2 restart util
            else
              pm2 start npm --name util -- start
            fi

            pm2 save

            echo "Production deployment completed."