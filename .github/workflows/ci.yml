name: Production CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

jobs:

  audit:
    name: 1. NPM Audit
    uses: ./.github/workflows/security.yml

  secrets:
    name: 2. Secret Scan
    needs: audit
    uses: ./.github/workflows/secrets.yml

  codeql:
    name: 3. CodeQL
    needs: secrets
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

#   quality:
#     name: 4. Code Quality
#     needs: codeql
#     uses: ./.github/workflows/quality.yml

  build:
    name: 5. Production Build
    needs: secrets
    uses: ./.github/workflows/build.yml

  sbom:
    name: 6. SBOM
    needs: build
    uses: ./.github/workflows/sbom.yml

  approval:
    name: 7. Production Approval
    needs: sbom
    runs-on: ubuntu-latest

    environment:
      name: utilCICD

    steps:
      - name: Production Approved
        run: |
          echo "All production gates passed."
          echo "Production deployment approved."
          echo "Commit: $GITHUB_SHA"

  backup:
    name: 8. Production Backup
    needs: approval
    uses: ./.github/workflows/backup.yml
    secrets: inherit

  deploy:
    name: 9. Production Deployment
    needs: backup
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

  health:
    name: 10. Production Health Check
    needs: deploy
    uses: ./.github/workflows/health-check.yml
    secrets: inherit

  rollback:
    name: 11. Automatic Rollback
    needs:
      - deploy
      - health
    if: |
      always() &&
      (
        needs.deploy.result == 'failure' ||
        needs.health.result == 'failure'
      )
    uses: ./.github/workflows/rollback.yml
    secrets: inherit

  report:
    name: 12. Deployment Report
    needs:
      - audit
      - secrets
      - codeql
      - build
      - sbom
      - approval
      - backup
      - deploy
      - health
      - rollback
    if: always()
    uses: ./.github/workflows/report.yml

  notification:
    name: 13. Deployment Notification
    needs:
      - report
    if: always()
    uses: ./.github/workflows/notifications.yml
    secrets: inherit